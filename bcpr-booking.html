<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>จองคอร์ส B-CPR ออนไลน์ | JIA TRAINER CENTER</title>
<meta name="description" content="จองคอร์สอบรม B-CPR การช่วยชีวิตขั้นพื้นฐานสำหรับประชาชน ออนไลน์ — เลือกรอบ ชำระเงิน แนบสลิป 600 บาท/ท่าน">
<meta http-equiv="refresh" content="0; url=booking.html?course=B-CPR">
<link rel="canonical" href="booking.html?course=B-CPR">
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var target = 'booking.html?course=B-CPR';
  var classId = params.get('class_id');
  if(classId) target += '&class_id=' + encodeURIComponent(classId);
  location.replace(target);
})();
</script>
</head>
<body>
<p>กำลังนำท่านไปยังหน้าจองคอร์ส B-CPR… หากไม่เปลี่ยนหน้าอัตโนมัติ <a id="fallbackLink" href="booking.html?course=B-CPR">กดที่นี่</a></p>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var classId = params.get('class_id');
  if(classId){
    document.getElementById('fallbackLink').href = 'booking.html?course=B-CPR&class_id=' + encodeURIComponent(classId);
  }
})();
</script>
</body>
</html>
